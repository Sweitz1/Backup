# Runs the local model server and private search engine. The web app runs with
# `npm run dev` / `npm start`. Both are bound to localhost only, never your network.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Private metasearch engine for the web_search tool. Queries go out from here to
  # the search engines; nothing is tied to a Google or Bing account.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Generate one with: openssl rand -hex 32  (put it in a .env file next to this one)
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped

volumes:
  ollama:
