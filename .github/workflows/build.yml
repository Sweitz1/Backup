name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest is moving to a new image; 24.04 ships the Android SDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "${ANDROID_HOME}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            echo "::error title=Android SDK::ANDROID_HOME is not set on this runner image"
            exit 1
          fi
          ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" 2>/dev/null | head -40
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs a Gradle command; on failure, puts the tail of the log into an error annotation
      # so the cause is visible on the check run without opening the full log.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log; then
            msg=$(grep -E "What went wrong|error:|e: |FAILURE|Could not|Exception" build.log | head -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
            echo "::error title=assembleDebug failed::${msg:-see log}"
            tail -60 build.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | sed 's/^/::error title=assembleDebug log tail::/'
            echo
            exit 1
          fi

      - name: Name debug APK
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APK_TAG=${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/VeniceX3-${VERSION}-${GITHUB_SHA::7}-debug.apk"

      # No API key is baked into these builds (the repo is public); set it on the glasses with adb.
      - name: Upload debug APK (install this one)
        uses: actions/upload-artifact@v4
        with:
          name: VeniceX3-${{ env.APK_TAG }}-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log; then
            msg=$(grep -E "FAILED|What went wrong|e: |AssertionError" test.log | head -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
            echo "::error title=Unit tests failed::${msg:-see log}"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # Minified with R8. Unsigned: sign it with your own key before distributing.
      - name: Build release APK (unsigned)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee release.log; then
            msg=$(grep -E "What went wrong|ERROR|Missing class|e: " release.log | head -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
            echo "::warning title=assembleRelease failed::${msg:-see log}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/VeniceX3-${APK_TAG}-release-unsigned.apk"

      - name: Upload release APK (unsigned)
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VeniceX3-${{ env.APK_TAG }}-release-unsigned-apk
          path: dist/*-release-unsigned.apk
          retention-days: 30
