name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build the APKs and
# publish a GitHub Release with them attached. The notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error title=Version mismatch::Tag ${TAG} but versionName is ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # Optional signing: add repository secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
      # SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD to get a signed release APK. Without them the
      # release APK is attached unsigned, and the debug APK is the one to install.
      - name: Sign release APK
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/VeniceX3-${VERSION}-debug.apk"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out "dist/VeniceX3-${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            cp "$UNSIGNED" "dist/VeniceX3-${VERSION}-release-unsigned.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: VeniceX3 ${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
