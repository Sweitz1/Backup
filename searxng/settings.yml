# SearXNG config for the web_search tool. Only reachable from this machine (see docker-compose.yml).
# Full reference: https://docs.searxng.org/admin/settings/
use_default_settings: true

server:
  # Overridden by the SEARXNG_SECRET environment variable.
  secret_key: "set-SEARXNG_SECRET-instead"
  limiter: false # single private user; no rate limiting needed
  image_proxy: false

search:
  formats:
    - html
    - json # required: the app reads results as JSON

general:
  instance_name: "Private LLM search"
